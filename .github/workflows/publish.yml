# Публикация лендинга: push в develop, ручной запуск и ежечасное обновление данных о релизах
# выкладываются на https://utils.cyber-tech.online. Сервер принимает архив только командой utils-receive.
# Секреты окружения production (только ветка develop): UTILS_DEPLOY_KEY — приватный ключ utils-deploy;
# UTILS_KNOWN_HOSTS — строка known_hosts, полученная по админскому SSH (не ssh-keyscan, см. server/README.md).
# Ручной запуск с другой ветки собирает и тестирует, но не выкладывает.
name: publish

on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# Токену GitHub — только чтение. Ключ выкладки попадает лишь в задачу deploy, где не запускаются
# ни npm, ни зависимости проекта: сборка (npm ci, тесты, build) идёт в отдельной задаче и передаёт dist артефактом.
permissions:
  contents: read

jobs:
  # Только по расписанию и без npm (bash, curl, jq): дешёвая проверка, нужна ли сборка вообще.
  # run=true, если сайт отдаёт не голову develop (отменённый или упавший push), если версия или статус
  # релиза в GitHub отличаются от живого releases.json, или если что-то не удалось получить.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      stale: ${{ steps.decide.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/content/products

      - id: decide
        name: Сравнить сайт с головой develop и релизами в GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-check.sh https://utils.cyber-tech.online "$(git rev-parse HEAD)" .

  build:
    needs: check
    # check пропущен (push, ручной запуск) — сборка идёт; по расписанию — только если check сказал run=true
    # или сам упал (неопределённость — собираем). !cancelled() нужен, чтобы пропущенный check не пропускал build.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.run == 'true' || needs.check.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.releases.outputs.changed }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      # push и ручной запуск собирают ровно github.sha (для ручного — голову выбранной ветки), а не подвижный develop:
      # иначе запуск для коммита A мог бы собрать и выложить B, а перезапуск — самый свежий коммит.
      # Расписание идёт на ветке по умолчанию, поэтому берёт голову develop: оно выкладывает её текущее
      # состояние со свежими данными о релизах.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          persist-credentials: false

      - id: rev
        name: Запомнить коммит сборки
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # e2e (Playwright) в CI не запускается: браузеров на раннере нет, их прогоняют локально перед слиянием.
      - run: npm test

      # GITHUB_TOKEN нужен fetch-releases (API GitHub, лимит выше, чем без токена).
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Только по расписанию: если живой releases.json совпал со свежим, данные выкладывать незачем
      # (deploy всё равно пойдёт, если check увидел на сайте старый коммит). Не удалось получить живой файл —
      # считаем, что изменилось.
      - id: releases
        name: Сравнить releases.json с опубликованным
        if: github.event_name == 'schedule'
        run: npx tsx scripts/releases-changed.ts dist/releases.json https://utils.cyber-tech.online/releases.json

      - name: Упаковать сборку
        run: tar -C dist -czf site.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 1

  deploy:
    needs: [check, build]
    # Выкладывается только develop. По расписанию — если сайт отстал от develop (stale) или изменились релизы.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/develop' &&
      (github.event_name != 'schedule' || needs.check.outputs.stale == 'true' || needs.check.result == 'failure' ||
      needs.build.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Секреты выкладки лежат в окружении production, доступном только ветке develop.
    environment: production
    env:
      SERVER: utils-deploy@185.36.144.150
      SITE: https://utils.cyber-tech.online
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      # Из репозитория нужен только смоук и список продуктов; npm здесь не запускается.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: repo
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/content/products

      - name: Выложить сборку
        env:
          DEPLOY_KEY: ${{ secrets.UTILS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.UTILS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Код 6 — приёмник занят другой выкладкой: до 3 попыток с паузой 20 с. Остальные ненулевые коды
          # (в том числе 7 — загрузка не уложилась в срок приёмника) — сразу сбой, без повтора.
          for attempt in 1 2 3; do
            rc=0
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$SERVER" "$SHA" < site.tar.gz || rc=$?
            if [ "$rc" -ne 6 ]; then break; fi
            echo "Приёмник занят (попытка $attempt из 3)" >&2
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          rm -f ~/.ssh/deploy
          exit "$rc"

      # Живой releases.json сравнивается с артефактным после нормализации jq -S (порядок ключей и пробелы не важны).
      - name: Проверить, что сайт отдаёт этот коммит и свежие релизы
        run: |
          mkdir built
          tar -xzf site.tar.gz -C built
          jq -S . built/releases.json > built.json
          for _attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 10 --max-time 20 "$SITE/release.txt" | grep -q "^$SHA " \
              && curl -fsS --connect-timeout 10 --max-time 20 "$SITE/releases.json" | jq -S . > live.json \
              && cmp -s built.json live.json; then
              echo "Опубликовано: $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Сайт не отдаёт коммит $SHA и собранный releases.json" >&2
          exit 1

      - name: Смоук
        run: bash repo/scripts/smoke.sh "$SITE" repo
