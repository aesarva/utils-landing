# utils.cyber-tech.online по https. Порт 443 держит xray (REALITY): соединения с чужим SNI он отдаёт
# в nginx на 127.0.0.1:8443, поэтому сайт слушает там же, где atlas.hollow-haven.com и cyber-tech.online.
# Сайт статический и открытый, входа нет; индексацией управляет сам сайт (INDEXABLE), X-Robots-Tag не ставится.
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name utils.cyber-tech.online;

    ssl_certificate     /etc/nginx/ssl/utils.cyber-tech.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/utils.cyber-tech.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/utils/site/current;
    index index.html;
    # nginx слушает 8443 за xray: абсолютный адрес в переадресации показал бы этот порт наружу.
    absolute_redirect off;
    access_log /var/log/nginx/utils.access.log;
    error_page 404 /404.html;
    # Симлинки внутри релиза не отдаются; сама current входит в document_root, поэтому работает.
    disable_symlinks on from=$document_root;

    # Сжатие текстовых ответов (text/html сжимается по умолчанию). HSTS — после проверки сертификата, см. README.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # add_header в location заменяет серверные, поэтому в каждом location со своими заголовками
    # заголовки безопасности повторены целиком.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Хешированная сборка Astro и шрифты: имя меняется вместе с содержимым.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Номер релиза и снимок релизов продуктов: всегда свежие (expires -1 даёт Cache-Control: no-cache).
    location = /release.txt {
        expires -1;
        default_type text/plain;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location = /releases.json {
        expires -1;
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Страницы (каталоги с index.html) и 404.html: браузер каждый раз сверяется с сервером.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
