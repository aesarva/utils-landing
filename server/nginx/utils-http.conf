# utils.cyber-tech.online, порт 80: проверка acme.sh и переадресация на https.
server {
    listen 80;
    listen [::]:80;
    server_name utils.cyber-tech.online;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
